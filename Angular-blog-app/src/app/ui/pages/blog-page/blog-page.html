<div class="page-shell blog-page">
    <div class="blog-page-layout">
        <app-blog-admin-panel *appHasRole="'admin'" [isLoading]="isLoading()" (openForm)="openForm()"
            (toggleStats)="toggleStats()"></app-blog-admin-panel>

        <main class="blog-main-content">
            @if (requestError()) {
            <p class="blog-error-message">
                {{ requestError() }}
            </p>
            }

            <app-blog-articles-section [isLoading]="isLoading()" [articles]="articlesStore.articles()"
                [currentPage]="articlesStore.activePage()" [totalPages]="totalPages()"
                (deleteArticle)="deleteArticle($event)" (editArticle)="openEditForm($event)"
                (previousPage)="goToPreviousPage()" (nextPage)="goToNextPage()" />
        </main>
    </div>

    @if (isFormVisible()) {
    <app-article-form [articleToEdit]="articleToEdit()" (submitArticle)="saveArticle($event)"
        (closeForm)="closeForm()" />
    }

    @if (isStatsVisible()) {
    <app-blog-stats-modal (close)="closeStats()" />
    }
</div>
