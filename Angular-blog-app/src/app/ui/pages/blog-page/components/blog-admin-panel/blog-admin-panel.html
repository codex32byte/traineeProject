<aside class="admin-panel-icons">
    <button type="button" class="admin-icon-btn" title="Create article" aria-label="Create article"
        (click)="openForm.emit()" [disabled]="isLoading">
        <mat-icon>post_add</mat-icon>
    </button>

    <button type="button" class="admin-icon-btn" title="Show statistics" aria-label="Show statistics"
        (click)="toggleStats.emit()" [disabled]="isLoading">
        <mat-icon>query_stats</mat-icon>
    </button>
</aside>
