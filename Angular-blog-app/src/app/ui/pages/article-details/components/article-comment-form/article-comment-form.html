<mat-card class="article-comment-form-card">
    <p class="article-section-header__eyebrow">
        Join discussion
    </p>

    <h2>
        Add comment
    </h2>

    <form [formGroup]="form" (ngSubmit)="submitComment()">
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>

            <input matInput type="text" formControlName="author" placeholder="Your name" />

            @if (form.controls.author.invalid && form.controls.author.touched) {
            <mat-error>Name is required</mat-error>
            }
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Comment</mat-label>

            <textarea matInput formControlName="text" placeholder="Write your comment" rows="5"></textarea>

            @if (form.controls.text.invalid && form.controls.text.touched) {
            <mat-error>Comment is required</mat-error>
            }
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="article-comment-form-card__submit"
            [disabled]="form.invalid">
            <mat-icon>add_comment</mat-icon>
            Add comment
        </button>
    </form>
</mat-card>
