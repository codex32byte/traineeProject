<header class="index-header">
    <nav class="navbar">
        <div class="navbar-logo">
            <a routerLink="/">codeX-folio</a>
        </div>

        <ul class="nav-links">
            <li>
                <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
                    Home
                </a>
            </li>

            <li>
                <a routerLink="/blog" routerLinkActive="active-link">
                    Blog
                </a>
            </li>

            <li>
                <a [routerLink]="[]" fragment="contacts">
                    Contact
                </a>
            </li>

            <li class="auth-nav-item">
                @if (currentUser()) {
                <button type="button" class="user-menu-button" aria-label="Open user menu" (click)="toggleUserMenu()">
                    <mat-icon>account_circle</mat-icon>
                    <span>{{ currentUser()!.username }}</span>
                    <mat-icon class="user-menu-button__arrow">
                        {{ isUserMenuOpen() ? 'expand_less' : 'expand_more' }}
                    </mat-icon>
                </button>

                @if (isUserMenuOpen()) {
                <div class="user-menu">
                    <p class="user-menu__label">Пользователь:</p>
                    <p class="user-menu__name">{{ currentUser()!.username }}</p>
                    <p class="user-menu__role">{{ currentUser()!.role }}</p>

                    <button type="button" class="user-menu__logout" (click)="logout()">
                        <mat-icon>logout</mat-icon>
                        Выход
                    </button>
                </div>
                }
                } @else {
                <button type="button" class="auth-login-button" (click)="openAuthDialog()">
                    <mat-icon>login</mat-icon>
                    Вход
                </button>
                }
            </li>
        </ul>
    </nav>
</header>
